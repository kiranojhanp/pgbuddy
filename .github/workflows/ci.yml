name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (postgres.js ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["4.1.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.19"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Use postgres.js ${{ matrix.postgres-version }}
        run: bun add --dev --exact postgres@${{ matrix.postgres-version }}

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run test:types

      - name: Tests With Coverage
        run: bun run test:coverage

  postgres:
    name: test real PostgreSQL (postgres.js ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["4.1.1"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgbuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGBUDDY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgbuddy_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.19"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Use postgres.js ${{ matrix.postgres-version }}
        run: bun add --dev --exact postgres@${{ matrix.postgres-version }}

      - name: Tests
        run: bun test
