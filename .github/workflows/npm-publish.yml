name: Publish to NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.19"

      - name: Extract Version
        shell: bash
        run: |
          # Pulls the version from package.json and sets it to GITHUB_ENV
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and Test
        run: |
          bun run lint
          bun test

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          git fetch origin "$DEFAULT_BRANCH" --depth=1
          DEFAULT_SHA=$(git rev-parse "origin/$DEFAULT_BRANCH")
          HEAD_SHA=$(git rev-parse HEAD)

          if [[ "$HEAD_SHA" != "$DEFAULT_SHA" ]]; then
            echo "Error: Publish must run from the latest commit on $DEFAULT_BRANCH."
            echo "Checked out: $HEAD_SHA | $DEFAULT_BRANCH: $DEFAULT_SHA"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "Error: Git tag (v$TAG) does not match package.json version ($VERSION)"
              exit 1
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Manual publish from $GITHUB_REF: tag check skipped."
          else
            echo "Error: Manual publish must run from $DEFAULT_BRANCH (got $GITHUB_REF)."
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
